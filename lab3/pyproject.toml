[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab3"
version = "0.0.1"
dependencies = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
    "matplotlib",
    "numpy",
    "scikit-learn",
    "scipy",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
